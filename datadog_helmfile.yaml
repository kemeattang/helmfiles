
repositories:
- name: datadog
  url: https://helm.datadoghq.com

releases:
- name: datadog
  namespace: kube-system
  chart: datadog/datadog
  version: 3.6.6 # https://github.com/DataDog/helm-charts/tree/datadog-3.6.6/charts/datadog
  values:
  - agents:
      containers:
        agent:
          logLevel: WARN
        processAgent:
          logLevel: WARN
        traceAgent:
          env:
            - name: DD_APM_IGNORE_RESOURCES
              value: "GET /healthcheck"     
          logLevel: WARN
        systemProbe:
          logLevel: WARN
        securityAgent:
          logLevel: WARN
    datadog:
      containerExclude: "kube_namespace:secops"
      clusterName: XXXX
      apiKey: XXX
      appKey: XXXX
      logs:
        enabled: true
        containerCollectAll: true
      apm:
        enabled: true
      processAgent:
        enabled: true
      dogstatsd:
        port: 8125
        useHostPort: true
        nonLocalTraffic: false
    providers:
      eks:
        ec2:
          useHostnameFromFile: true
  timeout: 600
  wait: true
